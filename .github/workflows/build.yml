name: build

on:
  push:
    branches: [main, macos-support]
  pull_request:

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

  windows-mingw:
    name: windows-mingw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (mingw)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
          make windows CC=i686-w64-mingw32-gcc
